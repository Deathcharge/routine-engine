[pytest]
minversion = 7.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
markers =
    workflow: test workflow functionality
    schedule: test scheduling
    execution: test execution
    task: test task functionality
    engine: test engine
    integration: test integration scenarios
