[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "helix-flow"
version = "1.0.0"
description = "AI flow-orchestration framework — chains, tools, memory, prompts, agents, and streaming"
readme = "README.md"
license = { text = "Proprietary" }
requires-python = ">=3.10"
authors = [{ name = "Helix Collective" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Framework :: FastAPI",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.0",
    "fastapi>=0.100",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.20"]
search = ["duckduckgo-search", "wikipedia"]
db = ["asyncpg"]
all = ["helix-flow[openai,anthropic,search,db]"]

[tool.setuptools.packages.find]
where = ["."]
include = ["helix_flow*"]
