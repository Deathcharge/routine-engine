name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest --cov --cov-report=term-missing
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Verify wheel contents and installed CLI
        shell: bash
        run: |
          python -m venv /tmp/routine-wheel
          /tmp/routine-wheel/bin/python -m pip install dist/*.whl
          /tmp/routine-wheel/bin/python -c "from routine_engine import RoutineEngine; print(RoutineEngine)"
          /tmp/routine-wheel/bin/routine-engine demo --name CI
          /tmp/routine-wheel/bin/routine-engine schema | /tmp/routine-wheel/bin/python -m json.tool >/dev/null
          PYTHONPATH=. /tmp/routine-wheel/bin/routine-engine run examples/release-readiness.json --plugin examples.release_actions

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest
